# 테스트 전용 프로필: 외부 MySQL 없이 인메모리 H2 로 컨텍스트를 띄운다.
spring.datasource.url=jdbc:h2:mem:songrec;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# 기본값 없는 환경변수 플레이스홀더를 테스트용 더미 값으로 채운다.
jwt.secret=test-jwt-secret-key-for-ci-only-0123456789abcdefghijklmnopqrstuvwxyz
spotify.client-id=test-client-id
spotify.client-secret=test-client-secret
openai.api-key=test-openai-api-key
